<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Juego de fiesta: ordená cinco desgracias del 1 al 5 y adiviná cómo las ordena la víctima. Con un celular o uno cada uno.">
<meta name="theme-color" content="#5BC0EB">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%2217%22 fill=%22%23FFD23F%22 stroke=%22%231B1B2F%22 stroke-width=%223%22/%3E%3Cpath d=%22M22 6 11 22h7l-2 12 12-17h-7z%22 fill=%22%23FF5D8F%22 stroke=%22%231B1B2F%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Peor Imposible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: una columna angosta de viñetas de historieta sobre cielo con tramado; todo con contorno de tinta y sombra dura */
:root{
  --sky:#5BC0EB; --dots:#4BB3E0; --ink:#1B1B2F; --paper:#FFFFFF; --cream:#FFF6E0; --muted:#24324D;
  --pink:#FF5D8F; --yellow:#FFD23F; --green:#3DDC97; --orange:#FF8C42; --red:#F94144; --plum:#A0275E; --purple:#9B5DE5; --blue:#3A86FF;
  --h1:#3DDC97; --h2:#FFD23F; --h3:#FF8C42; --h4:#F94144; --h5:#A0275E;
  --ok:#3DDC97; --bad:#F94144; --scrim:rgba(27,27,47,.62);
  --display:"Luckiest Guy","Lilita One",Impact,"Arial Black",system-ui,sans-serif;
  --body:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  --line:3px solid var(--ink);
  --pop:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--sky);
  background-image:radial-gradient(var(--dots) 2.2px, transparent 2.7px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45; font-weight:600;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:560px; margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 44px;
  display:flex; flex-direction:column; gap:18px;
}
.wrap.enter > *{animation:rise .38s cubic-bezier(.2,1.4,.4,1) both}
.wrap.enter > *:nth-child(2){animation-delay:.04s} .wrap.enter > *:nth-child(3){animation-delay:.08s}
.wrap.enter > *:nth-child(4){animation-delay:.12s} .wrap.enter > *:nth-child(5){animation-delay:.16s}
.wrap.enter > *:nth-child(n+6){animation-delay:.2s}
h1,h2,h3{font-family:var(--display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:.02em}
h1{font-size:clamp(2.2rem, 10vw, 3rem); line-height:1; color:var(--paper); -webkit-text-stroke:2px var(--ink); paint-order:stroke fill; text-shadow:3px 3px 0 var(--ink)}
h2{font-size:1.55rem; line-height:1.05; color:var(--ink)}
p{margin:0}
.eyebrow{font-size:.76rem; font-weight:900; text-transform:uppercase; letter-spacing:.12em; color:var(--muted)}
.hint{color:var(--muted); font-size:.93rem}
.stack{display:flex; flex-direction:column; gap:10px}
.center{text-align:center; align-items:center}
.wait{color:var(--ink); text-align:center; font-weight:800; padding:14px; background:var(--paper); border:3px dashed var(--ink); border-radius:18px}
.err{color:var(--red); font-weight:900; background:var(--paper); border:var(--line); border-radius:12px; padding:8px 12px}

/* top bar */
.top{display:flex; align-items:center; gap:8px}
.brand{font-family:var(--display); font-size:1.2rem; color:var(--paper); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; text-shadow:2px 2px 0 var(--ink); margin-right:auto; white-space:nowrap; letter-spacing:.03em}
.brand span{color:var(--yellow)}
.pill{font-size:.8rem; font-weight:900; padding:5px 10px; border-radius:999px; background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.pill.hot{background:var(--pink); color:var(--paper)}
.iconbtn{font:900 .85rem var(--body); color:var(--ink); background:var(--paper); border:2.5px solid var(--ink); border-radius:12px; padding:6px 10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; min-height:38px; box-shadow:2px 3px 0 var(--ink)}
.iconbtn:active{transform:translate(2px,2px); box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:18px; height:18px; display:block}
.banner{background:var(--red); color:var(--paper); border:var(--line); border-radius:14px; padding:10px 12px; font-weight:900; font-size:.92rem; box-shadow:var(--pop)}

/* buttons */
.btn{
  font-family:var(--display); font-size:1.35rem; letter-spacing:.04em; line-height:1.1;
  border:var(--line); border-radius:18px; padding:15px 22px 13px; width:100%;
  background:var(--pink); color:var(--paper); cursor:pointer;
  -webkit-text-stroke:1.2px var(--ink); paint-order:stroke fill; text-shadow:2px 2px 0 var(--ink);
  box-shadow:0 6px 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.45; cursor:not-allowed; transform:none; filter:grayscale(.4)}
.btn.ghost{background:var(--paper); color:var(--ink); -webkit-text-stroke:0; text-shadow:none; font-size:1.15rem}
.btn.yellow{background:var(--yellow); color:var(--ink); -webkit-text-stroke:0; text-shadow:none}
@media (hover:hover){ .btn:not([disabled]):hover{animation:wiggle .35s ease-in-out} }
.link{background:none; border:0; color:var(--ink); text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px; font:800 .95rem var(--body); padding:8px; cursor:pointer; align-self:center}
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible{outline:4px solid var(--yellow); outline-offset:3px}

/* home */
.hero{display:flex; flex-direction:column; gap:16px; padding-top:20px}
.logo{font-family:var(--display); font-size:clamp(3rem, 15.5vw, 6rem); line-height:.9; margin:4px 0 6px; color:var(--yellow); -webkit-text-stroke:4px var(--ink); paint-order:stroke fill; text-shadow:6px 6px 0 var(--ink); letter-spacing:.02em}
.logo > span{display:block; width:max-content; max-width:100%}
.logo > span:first-child{transform:rotate(-4deg); animation:bounceIn .6s cubic-bezier(.2,1.6,.4,1) both}
.logo > span + span{color:var(--pink); transform:rotate(2deg); animation:bounceIn .6s .12s cubic-bezier(.2,1.6,.4,1) both}
.lede{font-size:1.15rem; max-width:32ch; font-weight:800; background:var(--paper); border:var(--line); border-radius:18px; padding:12px 14px; box-shadow:var(--pop); position:relative}
.lede::after{content:""; position:absolute; left:28px; bottom:-13px; width:20px; height:20px; background:var(--paper); border-right:var(--line); border-bottom:var(--line); transform:rotate(45deg) skew(10deg,10deg)}
.scale{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.scale div{border-radius:14px; padding:8px 2px 6px; text-align:center; background:var(--hc); color:var(--ht); border:var(--line); box-shadow:2px 3px 0 var(--ink)}
.scale b{display:block; font-family:var(--display); font-weight:400; font-size:1.7rem; line-height:1}
.scale small{font-size:.68rem; font-weight:900}
.modes{display:grid; gap:12px}
.mode{display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:center; text-align:left; background:var(--paper); color:var(--ink); border:var(--line); border-radius:20px; padding:14px 16px; cursor:pointer; font:inherit; box-shadow:0 6px 0 var(--ink)}
.mode:active{transform:translateY(4px); box-shadow:0 2px 0 var(--ink)}
.mode.main{background:var(--yellow)}
.mode svg{grid-row:span 2; width:46px; height:46px}
.mode b{font-family:var(--display); font-weight:400; font-size:1.35rem; line-height:1.1; letter-spacing:.03em}
.mode small{font-size:.9rem; font-weight:700; color:var(--muted)}
.mode[disabled]{opacity:.5; cursor:not-allowed}
details.box{background:var(--paper); border:var(--line); border-radius:18px; padding:4px 16px; box-shadow:var(--pop)}
details.box summary{cursor:pointer; font-weight:900; padding:12px 0; list-style-position:inside}
details.box[open]{padding-bottom:16px}
.rules{margin:0; padding-left:1.3em; display:flex; flex-direction:column; gap:8px}
.rules li::marker{color:var(--pink); font-family:var(--display)}
.meta{display:flex; gap:8px; flex-wrap:wrap}
.meta span{font-size:.82rem; font-weight:900; color:var(--ink); background:var(--paper); border:2.5px solid var(--ink); border-radius:999px; padding:4px 10px}

/* setup */
.plist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.plist li{display:flex; align-items:center; gap:10px; background:var(--paper); border:var(--line); border-radius:16px; padding:6px 6px 6px 12px; min-height:54px; box-shadow:3px 3px 0 var(--ink)}
.plist .tag{font-size:.75rem; font-weight:900; color:var(--muted); margin-left:auto; padding-right:8px}
.plist .nm{font-weight:900; font-size:1.05rem; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dot{width:18px; height:18px; border-radius:50%; background:var(--pc); border:2.5px solid var(--ink); flex:none}
.plist input{flex:1; min-width:0; background:transparent; border:0; color:var(--ink); font:800 1.08rem var(--body); padding:10px 4px}
.plist input::placeholder{color:var(--muted); opacity:.55}
.rm{background:transparent; border:0; color:var(--ink); font:900 1.5rem var(--body); width:40px; height:40px; border-radius:10px; cursor:pointer}
.rm[disabled]{opacity:.2}
.stepper{display:flex; align-items:center; gap:14px; background:var(--paper); border:var(--line); border-radius:16px; padding:10px 12px; box-shadow:3px 3px 0 var(--ink)}
.stepper button{width:46px; height:46px; border-radius:14px; border:var(--line); background:var(--yellow); color:var(--ink); font:400 1.6rem var(--display); cursor:pointer; box-shadow:0 3px 0 var(--ink)}
.stepper button:active{transform:translateY(2px); box-shadow:0 1px 0 var(--ink)}
.stepper button[disabled]{opacity:.35; background:var(--paper)}
.stepper b{font-family:var(--display); font-weight:400; font-size:2rem; min-width:1.4em; text-align:center; font-variant-numeric:tabular-nums}
.stepper p{flex:1; color:var(--muted); font-size:.92rem}
.decks{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.deck{text-align:left; background:var(--paper); color:var(--ink); border:var(--line); border-radius:16px; padding:10px; cursor:pointer; font:inherit; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; align-items:center; min-width:0; box-shadow:3px 3px 0 var(--ink); opacity:.6; transition:transform .12s, opacity .12s}
.deck .dicon{grid-row:span 2; width:38px; height:38px; display:block}
.deck b{font-weight:900; font-size:.95rem; line-height:1.15}
.deck small{color:var(--muted); font-size:.74rem; line-height:1.2; font-weight:700}
.deck.on{background:var(--cream); opacity:1; transform:rotate(-1deg)}
.deck.on:nth-child(even){transform:rotate(1deg)}
.deck[disabled]{cursor:default}
.switch{display:flex; align-items:center; gap:12px; background:var(--paper); border:var(--line); border-radius:16px; padding:12px; color:var(--ink); font:inherit; text-align:left; cursor:pointer; width:100%; box-shadow:3px 3px 0 var(--ink)}
.switch[disabled]{cursor:default}
.switch span{flex:1; min-width:0}
.switch b{display:block; font-weight:900}
.switch small{color:var(--muted); font-size:.85rem; font-weight:700}
.knob{flex:none; width:54px; height:32px; border-radius:16px; background:var(--paper); border:var(--line); position:relative; transition:background .15s}
.knob::after{content:""; position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:var(--ink); transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
.switch[aria-checked="true"] .knob{background:var(--green)}
.switch[aria-checked="true"] .knob::after{transform:translateX(22px)}
textarea, .field{width:100%; background:var(--paper); border:var(--line); border-radius:14px; color:var(--ink); font:700 1rem/1.4 var(--body); padding:12px; box-shadow:inset 0 3px 0 rgba(27,27,47,.08)}
textarea{min-height:110px; resize:vertical}
.field.code{font:400 2rem var(--display); letter-spacing:.3em; text-transform:uppercase; text-align:center; padding:10px}
.or{display:flex; align-items:center; gap:10px; color:var(--ink); font-size:.95rem; font-family:var(--display); letter-spacing:.05em}
.or::before,.or::after{content:""; flex:1; height:3px; border-radius:2px; background:var(--ink)}

/* lobby */
.codebox{background:var(--paper); border:var(--line); border-radius:22px; padding:18px; text-align:center; display:flex; flex-direction:column; gap:8px; align-items:center; box-shadow:var(--pop)}
.code{font-family:var(--display); font-size:3.8rem; letter-spacing:.16em; line-height:1; color:var(--yellow); -webkit-text-stroke:3px var(--ink); paint-order:stroke fill; text-shadow:4px 4px 0 var(--ink); padding-left:.16em}
.invite{display:grid; grid-template-columns:1fr; gap:8px; width:100%}

/* wheel */
.vname{color:var(--pc) !important}
.wheel{position:relative; width:min(80vw, 330px); max-width:100%; aspect-ratio:1; margin:10px auto 6px}
.wheel-rot{width:100%; height:100%; will-change:transform; filter:drop-shadow(5px 6px 0 var(--ink))}
.wheel-rot svg{display:block; width:100%; height:100%}
.wheel .pointer{position:absolute; left:50%; top:-14px; transform:translateX(-50%); width:34px; height:40px; z-index:2; filter:drop-shadow(2px 3px 0 var(--ink))}
.modbox{display:flex; gap:14px; align-items:center; background:var(--paper); border:var(--line); border-radius:18px; padding:14px; text-align:left; box-shadow:var(--pop)}
.modsym{flex:none; width:60px; height:60px; border-radius:16px; display:grid; place-items:center; background:var(--mc); color:var(--ink); font-family:var(--display); font-size:1.5rem; border:var(--line); box-shadow:2px 3px 0 var(--ink)}
.modbox strong{font-family:var(--display); font-weight:400; font-size:1.4rem; display:block; letter-spacing:.03em}
.modbox p{color:var(--muted); font-size:.95rem}
.modbox.pop{animation:bounceIn .5s cubic-bezier(.2,1.6,.4,1)}
.modtag{display:inline-flex; align-items:center; gap:8px; font-size:.85rem; font-weight:900; color:var(--ink)}
.modtag i{font-style:normal; font-family:var(--display); background:var(--mc); color:var(--ink); border:2px solid var(--ink); border-radius:8px; padding:2px 8px 0}

/* cards */
.cards{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px}
.card{background:var(--cream); color:var(--ink); border:var(--line); border-radius:18px; padding:14px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:start; box-shadow:5px 5px 0 var(--ink)}
.cards > li:nth-child(odd) .card{transform:rotate(-1deg)}
.cards > li:nth-child(even) .card{transform:rotate(1deg)}
.letter{width:38px; height:38px; border-radius:50%; background:var(--yellow); color:var(--ink); border:var(--line); display:grid; place-items:center; font-family:var(--display); font-size:1.2rem; padding-top:3px}
.card p{font-weight:900; font-size:1.1rem; line-height:1.25; padding-top:6px; min-width:0}
.swap{background:var(--paper); border:2.5px solid var(--ink); color:var(--ink); border-radius:10px; font:900 .78rem var(--body); padding:6px 9px; cursor:pointer; box-shadow:2px 2px 0 var(--ink)}
.card.rank, .card.big{grid-template-columns:auto 1fr}
.card .chips{grid-column:1 / -1}
.card.big{animation:flipIn .45s cubic-bezier(.2,1.3,.4,1) both; transform-origin:center}
.card.big p{font-size:1.45rem; padding-top:3px}

/* rating chips */
.h1{--hc:var(--h1); --ht:var(--ink)} .h2{--hc:var(--h2); --ht:var(--ink)} .h3{--hc:var(--h3); --ht:var(--ink)}
.h4{--hc:var(--h4); --ht:var(--paper)} .h5{--hc:var(--h5); --ht:var(--paper)}
.chips{display:grid; grid-template-columns:repeat(5, 1fr); gap:6px}
.chip{border:2.5px solid var(--ink); background:var(--paper); color:var(--ink); border-radius:14px; padding:7px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:1px; cursor:pointer; min-width:0; box-shadow:inset 0 -7px 0 var(--hc)}
.chip b{font-family:var(--display); font-weight:400; font-size:1.55rem; line-height:1}
.chip small{font-size:.64rem; font-weight:900; white-space:nowrap}
.chip.on{background:var(--hc); color:var(--ht); transform:translateY(-3px) rotate(-2deg); box-shadow:0 4px 0 var(--ink)}
.chip.on.just{animation:chipPop .3s cubic-bezier(.2,1.8,.4,1)}
.chip.h4.on b,.chip.h5.on b{-webkit-text-stroke:1px var(--ink); paint-order:stroke fill}
.chip.used{opacity:.3}
.tok{display:inline-grid; place-items:center; width:40px; height:40px; border-radius:50%; background:var(--hc); color:var(--ht); border:2.5px solid var(--ink); font-family:var(--display); font-size:1.3rem; padding-top:3px; flex:none}
.tok.lg{width:88px; height:88px; font-size:3rem; border-width:4px; box-shadow:4px 4px 0 var(--ink); animation:flipIn .55s .15s cubic-bezier(.2,1.5,.4,1) both}

/* handoff */
.handoff{display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; padding-top:24px}
.avatar{width:118px; height:118px; border-radius:50%; background:var(--pc); color:var(--ink); border:4px solid var(--ink); display:grid; place-items:center; font-family:var(--display); font-size:3.6rem; padding-top:6px; box-shadow:6px 6px 0 var(--ink); animation:bounceIn .5s cubic-bezier(.2,1.6,.4,1) both}
.handoff h1{font-size:clamp(2.7rem, 13vw, 3.8rem); color:var(--pc)}
.handoff .role{font-size:1.1rem; max-width:30ch; background:var(--paper); border:var(--line); border-radius:16px; padding:10px 14px; box-shadow:3px 3px 0 var(--ink)}
.handoff .btn{margin-top:10px}
.turns{display:flex; gap:6px; justify-content:center; flex-wrap:wrap}
.turns i{width:14px; height:14px; border-radius:50%; background:var(--paper); border:2.5px solid var(--ink)}
.turns i.done{background:var(--ink)}
.turns i.now{background:var(--pc); transform:scale(1.25)}
.pending{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.pending span{display:inline-flex; align-items:center; gap:6px; background:var(--paper); border:2.5px solid var(--ink); border-radius:999px; padding:5px 12px 5px 6px; font-weight:900; font-size:.9rem}
.pending span .dot{width:14px; height:14px; border-width:2px}
.pending span.done{opacity:.45; text-decoration:line-through}

/* reveal */
.truth{display:flex; align-items:center; gap:16px; background:var(--paper); border:var(--line); border-radius:18px; padding:14px; box-shadow:var(--pop)}
.truth p{font-size:1.05rem}
.truth strong{font-family:var(--display); font-weight:400; font-size:1.6rem; display:block; line-height:1.1; letter-spacing:.03em}
.guesses{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.guesses li{display:flex; align-items:center; gap:12px; background:var(--paper); border:var(--line); border-radius:16px; padding:8px 12px; box-shadow:3px 3px 0 var(--ink); animation:slideIn .4s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(.5s + var(--i) * 120ms)}
.guesses .nm{flex:1; min-width:0; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.guesses .tok{width:36px; height:36px; font-size:1.1rem}
.mark{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:900; font-size:1.2rem; flex:none; border:2.5px solid var(--ink)}
.mark.ok{background:var(--ok); color:var(--ink); transform:rotate(-8deg)}
.mark.bad{background:var(--paper); color:var(--red)}
.dots{display:flex; gap:6px; justify-content:center}
.dots i{width:30px; height:10px; border-radius:5px; background:var(--paper); border:2px solid var(--ink)}
.dots i.done{background:var(--pink)}
.defend{display:flex; align-items:center; gap:14px; background:var(--yellow); border:var(--line); border-radius:18px; padding:12px 14px; box-shadow:var(--pop); animation:bounceIn .4s cubic-bezier(.2,1.6,.4,1)}
.ring{flex:none; width:68px; height:68px; border-radius:50%; display:grid; place-items:center; border:var(--line); background:conic-gradient(var(--pink) calc(var(--p, 1) * 360deg), var(--paper) 0)}
.ring b{width:46px; height:46px; border-radius:50%; background:var(--paper); border:2.5px solid var(--ink); display:grid; place-items:center; font-family:var(--display); font-weight:400; font-size:1.5rem; padding-top:3px; font-variant-numeric:tabular-nums}
.defend p{font-weight:900}
.defend.over{background:var(--paper)}

/* score */
.rows{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.rows li{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; background:var(--paper); border:var(--line); border-radius:16px; padding:10px 12px; box-shadow:3px 3px 0 var(--ink)}
.rows .who{min-width:0}
.rows .who b{display:block; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rows .who small{color:var(--muted); font-size:.84rem}
.rows .pts{font-family:var(--display); font-size:1.8rem; color:var(--pink); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; text-shadow:2px 2px 0 var(--ink); font-variant-numeric:tabular-nums}
.rows li.vic{border-style:dashed; box-shadow:none; background:var(--cream)}
.rows li.full{background:var(--yellow); transform:rotate(-1deg)}
.standings{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.standings li{display:grid; grid-template-columns:1.8em 1fr auto; gap:10px; align-items:center}
.standings .pos{font-family:var(--display); color:var(--ink); font-size:1.3rem; text-align:center}
.standings li:first-child .pos{color:var(--yellow); -webkit-text-stroke:1.5px var(--ink); paint-order:stroke fill; font-size:1.6rem}
.standings .bar{display:flex; flex-direction:column; gap:4px; min-width:0}
.standings .bar span{font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.standings .bar i{display:block; height:14px; border-radius:7px; background:var(--pc); border:2.5px solid var(--ink); width:var(--w); min-width:14px; transition:width .6s cubic-bezier(.2,1.3,.4,1)}
.standings .sc{font-family:var(--display); font-size:1.6rem; font-variant-numeric:tabular-nums}
.panel{background:var(--paper); border:var(--line); border-radius:20px; padding:16px; display:flex; flex-direction:column; gap:14px; box-shadow:var(--pop)}

/* final */
.winner{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding-top:16px}
.winner h1{font-size:clamp(3rem, 14vw, 4.4rem); color:var(--pc)}
.crown{width:84px; height:52px; margin-bottom:-26px; position:relative; z-index:1; animation:bounceIn .6s .2s cubic-bezier(.2,1.6,.4,1) both}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.stat{background:var(--paper); border:var(--line); border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:6px; min-width:0; box-shadow:3px 3px 0 var(--ink); animation:rise .45s cubic-bezier(.2,1.4,.4,1) both; animation-delay:calc(var(--i) * 90ms)}
.stat:nth-child(4n+1){background:var(--cream)} .stat:nth-child(4n+2){transform:rotate(1deg)} .stat:nth-child(4n+3){transform:rotate(-1deg)}
.stat.wide{grid-column:1 / -1; background:var(--yellow)}
.stat .eyebrow{color:var(--pink)}
.stat.wide .eyebrow{color:var(--ink)}
.stat b{font-family:var(--display); font-weight:400; font-size:1.35rem; line-height:1.15; letter-spacing:.02em; overflow-wrap:anywhere}
.stat.wide b{font-family:var(--body); font-weight:900; font-size:1.1rem; background:var(--cream); border:2.5px solid var(--ink); border-radius:12px; padding:10px 12px}
.stat p{color:var(--muted); font-size:.88rem}

/* sheet */
.sheet{position:fixed; inset:0; z-index:20; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center}
.sheet-in{
  background:var(--sky); background-image:radial-gradient(var(--dots) 2.2px, transparent 2.7px); background-size:22px 22px;
  width:100%; max-width:560px; max-height:88vh; overflow:auto;
  border-radius:24px 24px 0 0; border:var(--line); border-bottom:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-top:16px; padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  display:flex; flex-direction:column; gap:18px; animation:sheetUp .3s cubic-bezier(.2,1.2,.4,1);
}
.sheet-head{display:flex; align-items:center; justify-content:space-between}
.modlist{list-style:none; margin:0; padding:12px; display:flex; flex-direction:column; gap:10px; background:var(--paper); border:var(--line); border-radius:18px}
.modlist li{display:flex; gap:12px; align-items:center}
.modlist .modsym{width:46px; height:46px; font-size:1.1rem; border-radius:12px}
.modlist p{font-size:.92rem; color:var(--muted)}
.modlist b{color:var(--ink)}
.danger{display:flex; flex-direction:column; gap:10px; border-top:3px dashed var(--ink); padding-top:14px}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:30; background:var(--ink); color:var(--paper); font-weight:900; padding:10px 16px; border-radius:999px; animation:bounceIn .35s cubic-bezier(.2,1.6,.4,1)}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:40}

@keyframes rise{from{transform:translateY(14px) scale(.98); opacity:0} to{opacity:1}}
@keyframes bounceIn{0%{transform:scale(.4); opacity:0} 70%{opacity:1} 100%{opacity:1}}
@keyframes flipIn{from{transform:perspective(600px) rotateY(90deg); opacity:.2} to{opacity:1}}
@keyframes slideIn{from{transform:translateX(-24px); opacity:0} to{opacity:1}}
@keyframes chipPop{0%{transform:scale(.8)} 100%{transform:translateY(-3px) rotate(-2deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)} 30%{transform:rotate(-1.5deg)} 65%{transform:rotate(1.5deg)}}
@keyframes sheetUp{from{transform:translateY(40%)} to{transform:none}}
@media (max-width:360px){ .decks, .stats{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>

let actx = null;
function ac(){
  if(muted) return null;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, dur, type='sine', vol=.2, when=0, slideTo=0){
  const a = ac(); if(!a) return;
  try{
    const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.03);
  }catch(e){}
}

/* ================= motor del juego ================= */
function buildPool(decks, custom){
  let p = [];
  DECKS.forEach(d=>{ if(decks.includes(d.id)) p = p.concat(d.cards); });
  String(custom||'').split('\n').map(s=>s.trim().slice(0,90)).filter(Boolean).slice(0,200).forEach(c=>p.push(c));
  return [...new Set(p)];
}
function draw(){ if(!H.deck.length) H.deck = shuffle(H.pool); return H.deck.pop(); }
function startGame(mode, players, s, code, hostId){
  const pool = buildPool(s.decks, draft.custom);
  const acts = (H && H.acts) || {};
  G = {v:2, gid:rid(), mode, code:code||null, hostId:hostId||null, settings:{...s},
       teams:!!s.teams, defendOn:!!s.defend, players, totalRounds:players.length*s.turns,
       round:1, victim:0, wheelRot:0, stats:null};
  H = {pool, deck:shuffle(pool), log:[], acts};
  newRound();
}
function newRound(){
  Object.assign(G, {phase:'spin', mod:null, spin:null, cards:[], rankings:{}, turn:0, reveal:0, defend:null, result:null});
}
function validRank(r){ return Array.isArray(r) && r.length===5 && [1,2,3,4,5].every(n=>r.includes(n)); }
function leaders(){ const mx = Math.max(...G.players.map(p=>p.score)); return G.players.filter(p=>p.score===mx).map(p=>p.id); }

function computeRound(){
  const vid = vic().id, truth = G.rankings[vid], m = G.mod, res = {};
  let best = 0;
  G.players.forEach(p=>{
    if(p.id===vid) return;
    const g = G.rankings[p.id] || [0,0,0,0,0], hits = [];
    for(let k=0;k<5;k++) if(g[k]===truth[k]) hits.push(truth[k]);
    const n = hits.length, ac = n===1 ? '1 acierto' : n+' aciertos';
    let total = n, note = ac;
    if(m==='sum'){ total = hits.reduce((a,b)=>a+b,0); note = n ? ac+' · '+hits.slice().sort().join(' + ') : ac; }
    else if(m==='double'){ total = n*2; note = ac+' × 2'; }
    else if(m==='triple'){ total = n*3; note = ac+' × 3'; }
    else if(m==='four' && hits.includes(4)){ total = n+4; note = ac+' + 4 por el 4'; }
    else if(m==='one' && hits.includes(1)){ total = n+1; note = ac+' + 1 por el 1'; }
    else if(m==='all' && n===5){ total = n+5; note = ac+' + 5 por el pleno'; }
    res[p.id] = {hits:n, total, note};
    best = Math.max(best, total);
  });
  res[vid] = {victim:true, total:best, note:'Víctima: igual al mejor de la ronda'};
  return res;
}
function scoreRound(){
  const res = computeRound(), vid = vic().id;
  G.result = res;
  G.players.forEach(p=>{ p.score += res[p.id].total; });
  const pts = {}; G.players.forEach(p=>pts[p.id]=res[p.id].total);
  H.log.push({v:vid, mod:G.mod, cards:G.cards.slice(), r:JSON.parse(JSON.stringify(G.rankings)), pts});
  G.phase = 'score';
}
function computeStats(){
  const log = H.log, nm = id => (pById(id)||{}).name || '?', out = [];
  const pair = {}, guess = {}, read = {};
  log.forEach(e=>{
    const t = e.r[e.v]; if(!t) return;
    G.players.forEach(p=>{
      const g = e.r[p.id]; if(p.id===e.v || !validRank(g)) return;
      const h = g.filter((x,k)=>x===t[k]).length, key = p.id+'>'+e.v;
      pair[key] = pair[key] || {g:p.id, v:e.v, h:0, n:0}; pair[key].h += h; pair[key].n += 5;
      guess[p.id] = guess[p.id] || {h:0, n:0, plenos:0}; guess[p.id].h += h; guess[p.id].n += 5; if(h===5) guess[p.id].plenos++;
      read[e.v] = read[e.v] || {h:0, n:0}; read[e.v].h += h; read[e.v].n += 5;
    });
  });
  const pct = o => o.h/o.n;
  const pairs = Object.values(pair);
  if(pairs.length){
    const best = pairs.reduce((a,b)=> pct(b)>pct(a) || (pct(b)===pct(a) && b.n>a.n) ? b : a);
    out.push({t:'Se conocen de memoria', b:nm(best.g)+' → '+nm(best.v), d:`Le acertó ${best.h} de ${best.n} cartas.`});
    const worst = pairs.reduce((a,b)=> pct(b)<pct(a) || (pct(b)===pct(a) && b.n>a.n) ? b : a);
    if(worst!==best && pct(worst)<pct(best)) out.push({t:'Ni idea', b:nm(worst.g)+' → '+nm(worst.v), d:`Le acertó ${worst.h} de ${worst.n}. ¿Se conocen?`});
  }
  const gs = Object.entries(guess);
  if(gs.length){
    const [id,g] = gs.reduce((a,b)=> pct(b[1])>pct(a[1]) ? b : a);
    out.push({t:'Mejor adivino', b:nm(id), d:`Acertó el ${Math.round(pct(g)*100)}% cuando no era víctima.`});
  }
  const rs = Object.entries(read);
  if(rs.length>1){
    const [id,r] = rs.reduce((a,b)=> pct(b[1])<pct(a[1]) ? b : a);
    out.push({t:'Imposible de leer', b:nm(id), d:`Como víctima, los demás le acertaron solo el ${Math.round(pct(r)*100)}%.`});
    const [id2,r2] = rs.reduce((a,b)=> pct(b[1])>pct(a[1]) ? b : a);
    if(id2!==id) out.push({t:'Libro abierto', b:nm(id2), d:`Como víctima, los demás le acertaron el ${Math.round(pct(r2)*100)}%.`});
  }
  const pl = gs.filter(([,g])=>g.plenos>0).sort((a,b)=>b[1].plenos-a[1].plenos);
  if(pl.length) out.push({t:'Plenos', b:pl.slice(0,3).map(([id,g])=>nm(id)+' ×'+g.plenos).join(' · '), d:'Acertaron las cinco cartas en una ronda.'});
  let br = null;
  log.forEach((e,i)=>Object.entries(e.pts).forEach(([id,p])=>{ if(id!==e.v && (!br || p>br.p)) br = {id, p, mod:e.mod, i}; }));
  if(br && br.p>0) out.push({t:'Mejor ronda', b:nm(br.id)+' +'+br.p, d:`En la ronda ${br.i+1}, con ${mod(br.mod).name}.`});
  let hot = null, calm = null;
  log.forEach(e=>e.cards.forEach((c,k)=>{
    const vals = Object.values(e.r).map(r=>r[k]).filter(x=>x>0); if(vals.length<3) return;
    const m = vals.reduce((a,b)=>a+b,0)/vals.length, v = vals.reduce((a,b)=>a+(b-m)**2,0)/vals.length;
    const it = {c:c.slice(0,90), v, m, min:Math.min(...vals), max:Math.max(...vals)};
    if(!hot || v>hot.v) hot = it;
    if(!calm || v<calm.v || (v===calm.v && m>calm.m)) calm = it;
  }));
  if(hot && hot.v>0) out.push({wide:1, t:'El que más dividió', b:hot.c, d:`Lo pusieron desde ${hot.min} (${WORD[hot.min].toLowerCase()}) hasta ${hot.max} (${WORD[hot.max].toLowerCase()}).`});
  if(calm && calm!==hot) out.push({wide:1, t:'Todos de acuerdo', b:calm.c, d:`Promedio ${calm.m.toFixed(1).replace('.',',')}: ${WORD[Math.round(calm.m)].toLowerCase()} para casi todos.`});
  return out;
}

/* Todas las jugadas pasan por acá. En modo online solo corre en el celular del anfitrión. */
function apply(type, arg, actor){
  if(!G) return false;
  arg = arg || {};
  const on = G.mode==='online';
  const hostish = !on || actor===G.hostId;
  const FLOW = {spin:1,toCards:1,swap:1,startRank:1,reveal:1,nextReveal:1,defend:1,nextRound:1,final:1};
  if(on && FLOW[type] && !hostish && G.players[G.victim] && actor!==vic().id) return false;
  switch(type){
    case 'start':
      if(!hostish || G.phase!=='lobby' || G.players.length<3) return false;
      startGame('online', G.players.map(p=>({...p, score:0})), G.settings, G.code, G.hostId); return true;
    case 'spin': {
      if(G.phase!=='spin' || G.mod) return false;
      const i = Math.floor(Math.random()*MODS.length), c = i*60 + 30 + (Math.random()-.5)*44, cur = G.wheelRot;
      G.spin = {id:rid(), rot: cur + 360*5 + (((-c - cur) % 360) + 360) % 360};
      G.mod = MODS[i].id; return true;
    }
    case 'toCards': {
      if(G.phase!=='spin' || !G.mod) return false;
      G.cards = []; let t = 0;
      while(G.cards.length<5 && t++<60){ const c = draw(); if(!G.cards.includes(c)) G.cards.push(c); }
      G.phase = 'cards'; return true;
    }
    case 'swap': {
      const k = arg.k|0; if(G.phase!=='cards' || k<0 || k>4) return false;
      let c = draw(), t = 0; while(G.cards.includes(c) && t++<8) c = draw();
      G.cards[k] = c; return true;
    }
    case 'startRank':
      if(G.phase!=='cards') return false;
      G.turn = 0; G.rankings = {}; G.phase = on ? 'rank' : 'handoff'; return true;
    case 'submitRank': {
      const id = arg.id, r = arg.r;
      if(!pById(id) || !validRank(r)) return false;
      if(on){
        if(actor!==id || G.phase!=='rank' || G.rankings[id]) return false;
        G.rankings[id] = r.slice();
        if(G.players.every(p=>G.rankings[p.id])) G.phase = 'ready';
        return true;
      }
      if(G.phase!=='rank') return false;
      G.rankings[id] = r.slice(); G.turn++;
      G.phase = G.turn < G.players.length ? 'handoff' : 'ready'; return true;
    }
    case 'skipMissing': {
      const vid = vic().id;
      if(!on || !hostish || G.phase!=='rank' || !G.rankings[vid]) return false;
      G.players.forEach(p=>{ if(!G.rankings[p.id]) G.rankings[p.id] = [0,0,0,0,0]; });
      G.phase = 'ready'; return true;
    }
    case 'reveal':
      if(G.phase!=='ready') return false;
      G.phase = 'reveal'; G.reveal = 0; G.defend = null; return true;
    case 'defend':
      if(G.phase!=='reveal' || !G.defendOn) return false;
      G.defend = {id:rid(), k:G.reveal}; return true;
    case 'nextReveal':
      if(G.phase!=='reveal' || (arg.at!==undefined && arg.at!==G.reveal)) return false;
      if(G.reveal<4){ G.reveal++; G.defend = null; return true; }
      scoreRound(); return true;
    case 'nextRound': {
      if(G.phase!=='score' || (arg.at!==undefined && arg.at!==G.round)) return false;
      if(G.round>=G.totalRounds && leaders().length===1) return false;
      if(G.spin) G.wheelRot = G.spin.rot % 360;
      G.round++; G.victim = (G.victim+1) % G.players.length; newRound(); return true;
    }
    case 'final':
      if(G.phase!=='score' || G.round<G.totalRounds || leaders().length!==1) return false;
      G.stats = computeStats(); G.phase = 'final'; return true;
    case 'again':
      if(!hostish || G.phase!=='final') return false;
      startGame(G.mode, G.players.map(p=>({...p, score:0})), G.settings, G.code, G.hostId); return true;
  }
  return false;
}
function dispatch(type, arg){
  if(!G) return;
  if(iAmHost()){
    if(apply(type, arg, online() ? me.pid : null)) commit(); else render();
  } else {
    sendAct(type, arg); render();
  }
}
function commit(){
  save();
  if(online() && net.isHost) publishHost();
  render();
}

/* ================= red (cada uno con su celular) ================= */
function bytes(s){ try{ return new TextEncoder().encode(s).length }catch(e){ return s.length*2 } }
function pubState(){
  const g = JSON.parse(JSON.stringify(G));
  if(g.phase==='rank'){ g.done = Object.keys(g.rankings); g.rankings = {}; }
  if(bytes(JSON.stringify(g)) > 3600 && g.result) Object.values(g.result).forEach(r=>{ r.note = ''; });
  while(bytes(JSON.stringify(g)) > 3600 && g.stats && g.stats.length) g.stats.pop();
  return g;
}
function publishHost(){
  if(!net.nr) return;
  net.nr.presence({code:net.code, pid:me.pid, name:me.name, host:true, g:pubState()}).catch(()=>{});
}
function sendAct(type, arg){
  if(!net.nr) return;
  net.actSeq++;
  net.nr.presence({act:{id:me.pid.slice(-5)+Date.now().toString(36)+net.actSeq, type, arg:arg||{}}}).catch(()=>{});
}
/* Dentro de Claude se usa la sala de Claude. En cualquier otra web, los celulares se conectan
   directo entre sí (WebRTC con PeerJS): el anfitrión es el centro y los demás se conectan a él. */
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === 'function');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let peerLibP = null;
function loadPeerLib(){
  if(window.Peer) return Promise.resolve();
  if(!peerLibP) peerLibP = new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
    s.onload = ()=> window.Peer ? res() : rej({type:'lib'});
    s.onerror = ()=>{ peerLibP = null; rej({type:'lib'}); };
    document.head.appendChild(s);
  });
  return peerLibP;
}
async function p2pRoom(code, asHost, reopen){
  await loadPeerLib();
  const hostId = 'peor-imposible-' + code.toLowerCase();
  const others = new Map(), conns = new Map(), subs = [];
  let mine = {}, snap = Object.freeze([]), closed = false, peer = null, conn = null, retry = null, connect = ()=>{};
  const fire = () => {
    snap = Object.freeze([{peer:'yo', isMe:true, sameTab:true, kind:'viewer', guest:false, by:null, presence:mine},
      ...[...others].map(([id, presence])=>({peer:id, isMe:false, sameTab:false, kind:'viewer', guest:false, by:null, presence}))]);
    subs.forEach(f=>{ try{ f({peers:snap, joined:[], left:[], updated:[]}); }catch(e){} });
  };
  const sendTo = c => { try{ if(c && c.open) c.send({t:'p', p:mine}); }catch(e){} };
  const newPeer = () => new Promise((res, rej)=>{
    const p = asHost ? new window.Peer(hostId, {debug:0}) : new window.Peer({debug:0});
    let done = false;
    const to = setTimeout(()=>{ if(!done){ done = true; try{ p.destroy(); }catch(e){} rej({type:'timeout'}); } }, 15000);
    p.on('open', ()=>{ if(!done){ done = true; clearTimeout(to); res(p); } });
    p.on('error', e=>{ if(!done){ done = true; clearTimeout(to); try{ p.destroy(); }catch(x){} rej(e || {type:'error'}); } });
  });
  for(let i=0;;i++){
    try{ peer = await newPeer(); break; }
    catch(e){
      // Si el anfitrión recarga la página, su código tarda unos segundos en liberarse.
      if(asHost && reopen && e && e.type==='unavailable-id' && i<6){ await sleep(4000); continue; }
      throw e;
    }
  }
  peer.on('disconnected', ()=>{ if(!closed) setTimeout(()=>{ try{ if(!closed && peer.disconnected) peer.reconnect(); }catch(e){} }, 1500); });
  if(asHost){
    peer.on('connection', c=>{
      c.on('open', ()=>{ conns.set(c.peer, c); sendTo(c); });
      c.on('data', d=>{ if(d && d.t==='p' && d.p && typeof d.p==='object'){ others.set(c.peer, d.p); fire(); } });
      const drop = ()=>{ if(conns.get(c.peer)===c) conns.delete(c.peer); if(others.delete(c.peer)) fire(); };
      c.on('close', drop); c.on('error', drop);
    });
    peer.on('error', ()=>{});
  } else {
    const lost = ()=>{ if(closed) return; if(others.delete('anfitrion')) fire(); clearTimeout(retry); retry = setTimeout(connect, 2500); };
    connect = ()=>{
      if(closed) return;
      const old = conn;
      const c = peer.connect(hostId, {reliable:true}); conn = c;
      try{ old && old.close(); }catch(e){}
      c.on('open', ()=>sendTo(c));
      c.on('data', d=>{ if(c===conn && d && d.t==='p' && d.p && typeof d.p==='object'){ others.set('anfitrion', d.p); fire(); } });
      c.on('close', ()=>{ if(c===conn) lost(); });
      c.on('error', ()=>{ if(c===conn) lost(); });
    };
    peer.on('error', e=>{ if(e && e.type==='peer-unavailable') lost(); });
    connect();
  }
  const onVisible = ()=>{
    if(document.visibilityState!=='visible' || closed) return;
    try{ if(peer.disconnected) peer.reconnect(); }catch(e){}
    if(!asHost && !(conn && conn.open)){ clearTimeout(retry); connect(); }
  };
  document.addEventListener('visibilitychange', onVisible);
  fire();
  return {
    presence: async patch => {
      const m = {...mine};
      for(const k in patch){ if(patch[k]===null) delete m[k]; else m[k] = patch[k]; }
      mine = JSON.parse(JSON.stringify(m));
      if(asHost) conns.forEach(sendTo); else sendTo(conn);
      fire();
    },
    peers: () => snap,
    onPeers: f => { subs.push(f); setTimeout(()=>f({peers:snap, joined:[], left:[], updated:[]}), 0); return ()=>{ const i = subs.indexOf(f); if(i>=0) subs.splice(i,1); }; },
    leave: async () => {
      closed = true; clearTimeout(retry); document.removeEventListener('visibilitychange', onVisible);
      try{ conns.forEach(c=>c.close()); conn && conn.close(); }catch(e){}
      try{ peer.destroy(); }catch(e){}
    },
    connected: () => !closed && !!peer && !peer.disconnected,
  };
}
async function getRoom(){
  if(net.room !== undefined) return net.room;
  if(!IN_CLAUDE){ net.room = {p2p:true}; return net.room; }
  try{ net.room = await window.claude.use('room'); }catch(e){ net.room = null; }
  return net.room;
}
async function openRoom(code, asHost, reopen){
  const room = await getRoom(); if(!room) throw {type:'no-room'};
  if(room.p2p) return p2pRoom(code, asHost, reopen);
  try{ return await room.join('pi-' + code.toLowerCase()); }catch(e){ return room; }
}
function netErrorText(e){
  if(e && e.type==='lib') return 'No se pudo cargar la conexión. Revisá que tengas internet.';
  if(e && e.type==='unavailable-id') return 'Esa sala ya está abierta en otro celular.';
  if(e && e.type==='browser-incompatible') return 'Este navegador no permite conectar celulares. Probá con Chrome o Safari actualizados.';
  return 'No se pudo conectar. Revisá internet y probá de nuevo.';
}

function inviteURL(){ return location.origin + location.pathname + '#' + (G && G.code || net.code || ''); }
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role','status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(()=>el.remove(), 2400);
}
function copyText(t){
  try{ navigator.clipboard.writeText(t).then(()=>toast('Enlace copiado'), ()=>toast(t)); }catch(e){ toast(t); }
}
function peerList(){
  try{ return net.nr.peers().filter(p=>p.presence && p.presence.code===net.code && typeof p.presence.pid==='string'); }catch(e){ return []; }
}
async function hostRoom(code, fresh){
  net.err = ''; net.busy = true; render();
  for(let i=0;;i++){
    try{ net.nr = await openRoom(code, true, !fresh); break; }
    catch(e){
      if(fresh && e && e.type==='unavailable-id' && i<3){ code = newCode(); continue; }
      net.busy = false; net.err = netErrorText(e); render(); return;
    }
  }
  net.busy = false;
  net.code = code; net.isHost = true; savedJoin = null;
  if(fresh){
    G = {v:2, mode:'online', phase:'lobby', code, hostId:me.pid,
         settings:{decks:draft.decks.slice(), turns:defaultTurns(3), touched:false, teams:draft.teams, defend:draft.defend},
         players:[{id:me.pid, name:me.name, color:PCOL[0], score:0}]};
    H = {pool:[], deck:[], log:[], acts:{}};
  }
  net.unsub && net.unsub();
  net.unsub = net.nr.onPeers(hostSync, ()=>{});
  view = 'game'; keepAwake(); commit();
}
function hostSync(){
  if(!G || !net.isHost) return;
  let changed = false;
  const peers = peerList().filter(p=>!p.presence.host && p.presence.pid!==me.pid);
  if(G.phase==='lobby'){
    const list = [G.players[0]];
    peers.forEach(p=>{
      const pid = p.presence.pid;
      if(list.length<MAXP && !list.some(x=>x.id===pid)) list.push({id:pid, name:cleanName(p.presence.name)||'Sin nombre', color:PCOL[list.length], score:0});
    });
    if(JSON.stringify(list)!==JSON.stringify(G.players)){
      G.players = list;
      if(!G.settings.touched) G.settings.turns = defaultTurns(Math.max(3,list.length));
      changed = true;
    }
  }
  peers.forEach(p=>{
    const pr = p.presence, pl = pById(pr.pid); if(!pl) return;
    if(pr.rank && pr.rank.gid===G.gid && pr.rank.round===G.round && G.phase==='rank' && !G.rankings[pl.id]){
      if(apply('submitRank', {id:pl.id, r:pr.rank.r}, pl.id)) changed = true;
    }
    if(pr.act && typeof pr.act.id==='string' && H.acts[pl.id]!==pr.act.id){
      H.acts[pl.id] = pr.act.id;
      if(apply(String(pr.act.type), pr.act.arg, pl.id)) changed = true;
      save();
    }
  });
  if(changed) commit(); else render();
}
async function joinRoom(code){
  net.err = '';
  code = String(code||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,4);
  if(code.length!==4){ net.err = 'El código tiene 4 letras.'; render(); return; }
  if(!me.name){ net.err = 'Poné tu nombre primero.'; render(); return; }
  net.busy = true; render();
  try{ net.nr = await openRoom(code, false); }
  catch(e){ net.busy = false; net.err = netErrorText(e); render(); return; }
  net.busy = false; net.prefill = '';
  try{ if(!IN_CLAUDE && location.hash) history.replaceState(null, '', location.pathname); }catch(e){}
  net.code = code; net.isHost = false; net.hostSeen = false; net.hostLost = false; net.lastG = null;
  G = null; H = null; savedJoin = {code};
  net.nr.presence({code, pid:me.pid, name:me.name, host:null, g:null}).catch(()=>{});
  net.unsub && net.unsub();
  net.unsub = net.nr.onPeers(clientSync, ()=>{});
  view = 'game'; keepAwake(); save(); render();
  clearTimeout(net.timer);
  net.timer = setTimeout(()=>{ if(!net.hostSeen && !net.isHost && view==='game'){ net.err = `No encontramos la sala ${code}. Revisá el código o pedile al anfitrión que la abra.`; render(); } }, 9000);
}
function clientSync(){
  if(net.isHost) return;
  const host = peerList().find(p=>p.presence.host===true && p.presence.g);
  if(host){
    net.hostSeen = true; net.hostLost = false; net.err = '';
    if(host.presence.g !== net.lastG){ net.lastG = host.presence.g; G = JSON.parse(JSON.stringify(host.presence.g)); }
  } else if(net.hostSeen){ net.hostLost = true; }
  render();
}
async function leaveRoom(){
  clearTimeout(net.timer);
  try{ net.unsub && net.unsub(); }catch(e){}
  try{ if(net.nr && net.nr.leave) await net.nr.leave(); else if(net.nr) await net.nr.presence({code:null, pid:null, name:null, host:null, g:null, act:null, rank:null}); }catch(e){}
  net.nr = null; net.code = null; net.isHost = false; net.hostSeen = false; net.hostLost = false; net.unsub = null;
}

function wheelSVG(){
  const cx=160, cy=160, r=152;
  const pt=(a,rad)=>[cx+rad*Math.sin(a*Math.PI/180), cy-rad*Math.cos(a*Math.PI/180)];
  let s = `<svg viewBox="0 0 320 320" role="img" aria-label="Ruleta con seis casillas"><circle cx="160" cy="160" r="158" fill="#1B1B2F"/>`;
  MODS.forEach((m,i)=>{
    const a0=i*60, a1=a0+60, mid=a0+30, [x0,y0]=pt(a0,r), [x1,y1]=pt(a1,r);
    s += `<path d="M${cx} ${cy} L${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z" fill="${m.color}" stroke="#1B1B2F" stroke-width="4" stroke-linejoin="round"/>`;
    s += `<g transform="rotate(${mid} ${cx} ${cy})"><text x="${cx}" y="${cy-92}" text-anchor="middle" dominant-baseline="middle" fill="#1B1B2F" style="font:400 30px var(--display)">${m.sym}</text>`;
    s += `<text x="${cx}" y="${cy-126}" text-anchor="middle" dominant-baseline="middle" fill="#1B1B2F" style="font:900 12px var(--body);letter-spacing:.06em">${m.name.toUpperCase()}</text></g>`;
  });
  s += `<circle cx="160" cy="160" r="32" fill="#FFD23F" stroke="#1B1B2F" stroke-width="5"/><circle cx="160" cy="160" r="10" fill="#1B1B2F"/></svg>`;
  return s;
}

/* ================= render ================= */
function render(){
  if(animating){ renderPending = true; return; }
  let html;
  if(view==='home') html = vHome();
  else if(view==='setup') html = vSetup();
  else if(view==='online') html = vOnline();
  else if(!G) html = vConnecting();
  else if(G.phase==='closed') html = vClosed();
  else html = ({lobby:vLobby, spin:vSpin, cards:vCards, handoff:vHandoff, rank:vRank, ready:vReady, reveal:vReveal, score:vScore, final:vFinal})[G.phase]();
  const key = view + (G ? ':'+G.phase+':'+G.round+':'+G.turn+':'+G.reveal : '');
  const newScreen = key!==lastKey;
  if(html!==lastHTML){
    const focusId = document.activeElement && document.activeElement.id;
    const caret = focusId && document.activeElement.selectionStart;
    if(newScreen){
      $app.classList.remove('enter'); void $app.offsetWidth; $app.classList.add('enter');
      clearTimeout(enterTimer); enterTimer = setTimeout(()=>$app.classList.remove('enter'), 700);
    }
    $app.innerHTML = html; lastHTML = html;
    if(focusId && /^(myname|joincode|custom|pname-\d+)$/.test(focusId)){
      const el = document.getElementById(focusId);
      if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(e){} }
    }
  }
  if(newScreen){ window.scrollTo(0,0); lastKey = key; }
  if(sheetOpen && view==='game' && G){ $sheet.innerHTML = vSheet(); $sheet.hidden = false; } else { $sheet.hidden = true; $sheet.innerHTML = ''; }
  afterRender();
}
function afterRender(){
  if(view!=='game' || !G) return;
  // ruleta
  if(G.phase==='spin' && G.spin && seenSpin!==G.spin.id) animateSpin();
  // defendete
  if(G.phase==='reveal' && G.defend && G.defend.id!==defendT.id){
    defendT = {id:G.defend.id, end:Date.now()+DEFEND_SECS*1000, k:G.defend.k, beeped:DEFEND_SECS+1, done:false};
    SFX.beep(); vib(40); render(); return;
  }
  // efectos por pantalla nueva
  const fx = G.phase+':'+G.gid+':'+G.round+':'+G.reveal;
  if(fx===lastFx) return;
  lastFx = fx;
  if(G.phase==='reveal'){
    const vid = vic().id, t = (G.rankings[vid]||[])[G.reveal];
    let good;
    if(online() && me.pid!==vid && G.rankings[me.pid]) good = G.rankings[me.pid][G.reveal]===t;
    else good = G.players.some(p=>p.id!==vid && G.rankings[p.id] && G.rankings[p.id][G.reveal]===t);
    if(good){ SFX.hit(); vib(35); } else { SFX.miss(); vib([60,40,60]); }
  } else if(G.phase==='score'){
    const full = Object.values(G.result||{}).some(x=>x.hits===5);
    if(full){ SFX.fanfare(); vib([50,50,50,50,120]); confetti(120); } else SFX.land();
  } else if(G.phase==='final'){ SFX.fanfare(); vib([80,60,80,60,200]); confetti(220); }
  else if(G.phase==='rank' || G.phase==='handoff'){ SFX.tap(); }
}
function confetti(n){
  try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  let cv = document.getElementById('confetti');
  if(!cv){ cv = document.createElement('canvas'); cv.id = 'confetti'; cv.setAttribute('aria-hidden','true'); document.body.appendChild(cv); }
  const dpr = Math.min(2, window.devicePixelRatio||1), W = innerWidth, Hh = innerHeight;
  cv.width = W*dpr; cv.height = Hh*dpr;
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  const cols = ['#FF5D8F','#FFD23F','#3DDC97','#3A86FF','#B48CFF','#FF8C42'];
  const ps = Array.from({length:n}, ()=>({
    x: W*(.2+Math.random()*.6), y: Hh*.42, vx:(Math.random()-.5)*13, vy:-(5+Math.random()*13),
    a: Math.random()*6, va:(Math.random()-.5)*.35, w:8+Math.random()*9, h:5+Math.random()*6, col:cols[Math.floor(Math.random()*cols.length)]
  }));
  const t0 = performance.now();
  const step = t => {
    c.clearRect(0,0,W,Hh);
    ps.forEach(p=>{
      p.vy += .38; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      c.save(); c.translate(p.x,p.y); c.rotate(p.a);
      c.fillStyle = p.col; c.strokeStyle = '#1B1B2F'; c.lineWidth = 2;
      c.fillRect(-p.w/2,-p.h/2,p.w,p.h); c.strokeRect(-p.w/2,-p.h/2,p.w,p.h); c.restore();
    });
    if(t - t0 < 3200) requestAnimationFrame(step); else c.clearRect(0,0,W,Hh);
  };
  requestAnimationFrame(step);
}
function animateSpin(){
  const el = document.getElementById('wheelRot'); if(!el) return;
  const id = G.spin.id, target = G.spin.rot;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 500 : 3800;
  animating = true;
  el.style.transition = `transform ${dur}ms cubic-bezier(.12,.82,.18,1)`;
  let lastSeg = null, alive = true;
  const watch = () => {
    if(!alive) return;
    try{
      const m = getComputedStyle(el).transform;
      if(m && m!=='none'){ const v = m.split('(')[1].split(')')[0].split(','); const ang = (Math.atan2(+v[1], +v[0])*180/Math.PI + 360) % 360; const seg = Math.floor(ang/60); if(lastSeg!==null && seg!==lastSeg) SFX.tick(); lastSeg = seg; }
    }catch(e){}
    requestAnimationFrame(watch);
  };
  requestAnimationFrame(()=>{ el.style.transform = `rotate(${target}deg)`; requestAnimationFrame(watch); });
  setTimeout(()=>{
    alive = false; seenSpin = id; animating = false; renderPending = false;
    SFX.land(); vib(40); render();
  }, dur + 120);
}
setInterval(()=>{
  if(!defendT.id || defendT.done) return;
  const left = Math.max(0, Math.ceil((defendT.end - Date.now())/1000));
  const ring = document.getElementById('defRing'), lbl = document.getElementById('defLeft');
  if(ring) ring.style.setProperty('--p', Math.max(0,(defendT.end-Date.now())/(DEFEND_SECS*1000)));
  if(lbl) lbl.textContent = left;
  if(left<=5 && left>0 && left<defendT.beeped){ defendT.beeped = left; SFX.beep(); }
  if(left<=0){ defendT.done = true; SFX.buzz(); vib(300); if(G && G.phase==='reveal') render(); }
}, 200);

/* ================= acciones de la interfaz ================= */
function T(){ return view==='setup' ? draft : (G && G.phase==='lobby' && net.isHost ? G.settings : null); }
function afterSettings(){ if(view==='setup'){ save(); render(); } else commit(); }
const A = {
  home(){ view='home'; },
  setup(){ if(G && G.mode==='local' && !draft.names.some(x=>x)) draft.names = G.players.map(p=>p.name); view='setup'; sheetOpen=false; },
  online(){ view='online'; net.err=''; getRoom().then(render); },
  resume(){ view='game'; keepAwake(); },
  reopen(){ hostRoom(G.code, false); return 'skip'; },
  rejoin(){ joinRoom(savedJoin.code); return 'skip'; },
  add(){ if(draft.names.length<MAXP){ draft.names.push(''); if(!draft.touched) draft.turns=defaultTurns(draft.names.length);} },
  rm(b){ if(draft.names.length>3){ draft.names.splice(+b.dataset.i,1); if(!draft.touched) draft.turns=defaultTurns(draft.names.length);} },
  tdec(){ const s=T(); if(!s) return 'skip'; s.turns=Math.max(1,s.turns-1); s.touched=true; afterSettings(); return 'skip'; },
  tinc(){ const s=T(); if(!s) return 'skip'; s.turns=Math.min(8,s.turns+1); s.touched=true; afterSettings(); return 'skip'; },
  deck(b){ const s=T(); if(!s) return 'skip'; const id=b.dataset.id; s.decks = s.decks.includes(id) ? s.decks.filter(x=>x!==id) : s.decks.concat(id); if(view!=='setup') draft.decks=s.decks.slice(); afterSettings(); return 'skip'; },
  teams(){ const s=T(); if(!s) return 'skip'; s.teams=!s.teams; draft.teams=s.teams; afterSettings(); return 'skip'; },
  defend(b){
    if(b.getAttribute('role')==='switch'){ const s=T(); if(!s) return 'skip'; s.defend=!s.defend; draft.defend=s.defend; afterSettings(); return 'skip'; }
    dispatch('defend'); return 'skip';
  },
  start(){
    if(!draft.decks.length) return;
    const players = draft.names.map((nm,i)=>({id:'p'+i, name:cleanName(nm)||((draft.teams?'Equipo ':'Jugador ')+(i+1)), color:PCOL[i], score:0}));
    startGame('local', players, {decks:draft.decks.slice(), turns:draft.turns, teams:draft.teams, defend:draft.defend});
    view='game'; keepAwake(); save();
  },
  create(){
    const nm = cleanName((document.getElementById('myname')||{}).value || me.name);
    if(!nm){ net.err='Poné tu nombre primero.'; return; }
    me.name = nm; save();
    hostRoom(newCode(), true); return 'skip';
  },
  share(){
    const url = inviteURL(), text = `¡Sumate a Peor Imposible! Código de sala: ${G.code}`;
    if(navigator.share){ navigator.share({title:'Peor Imposible', text, url}).catch(()=>{}); }
    else copyText(url);
    return 'skip';
  },
  copy(){ copyText(inviteURL()); return 'skip'; },
  noPrefill(){ net.prefill = ''; net.err = ''; },
  join(){
    const nm = cleanName((document.getElementById('myname')||{}).value || me.name);
    me.name = nm; save();
    joinRoom((document.getElementById('joincode')||{}).value); return 'skip';
  },
  leave(){ leaveRoom(); G=null; view='home'; savedJoin=null; save(); },
  startOnline(){ dispatch('start'); return 'skip'; },
  spin(){ if(animating) return 'skip'; const b=document.getElementById('spinBtn'); if(b){ b.disabled=true; b.textContent='Girando…'; } dispatch('spin'); return 'skip'; },
  toCards(){ dispatch('toCards'); return 'skip'; },
  swap(b){ dispatch('swap',{k:+b.dataset.k}); return 'skip'; },
  startRank(){ dispatch('startRank'); return 'skip'; },
  skipMissing(){ dispatch('skipMissing'); return 'skip'; },
  showRank(){ G.phase='rank'; save(); },
  notme(){ myRankKey=''; G.phase='handoff'; save(); },
  pick(b){
    const k=+b.dataset.k, v=+b.dataset.v, d=myRank, prev=d[k], other=d.indexOf(v);
    if(prev===v) d[k]=0; else { if(other>-1 && other!==k) d[other]=prev||0; d[k]=v; }
    justPicked = k+':'+v;
    SFX.tap(); vib(10);
  },
  confirm(){
    if(!myRank.every(x=>x>0)) return 'skip';
    const r = myRank.slice();
    if(!online()){ const p = G.players[(G.victim + G.turn) % G.players.length]; myRankKey=''; dispatch('submitRank',{id:p.id, r}); return 'skip'; }
    net.sentRank = G.gid+':'+G.round;
    if(net.isHost){ if(apply('submitRank',{id:me.pid, r}, me.pid)) commit(); else render(); }
    else { net.nr && net.nr.presence({rank:{gid:G.gid, round:G.round, r}}).catch(()=>{}); render(); }
    SFX.land(); vib(30); return 'skip';
  },
  reveal(){ dispatch('reveal'); return 'skip'; },
  nextReveal(){ dispatch('nextReveal',{at:G.reveal}); return 'skip'; },
  nextRound(){ dispatch('nextRound',{at:G.round}); return 'skip'; },
  final(){ dispatch('final'); return 'skip'; },
  again(){ dispatch('again'); return 'skip'; },
  exit(){
    if(online()){ leaveRoom(); }
    G=null; H=null; savedJoin=null; view = 'home'; save();
  },
  mute(){ muted=!muted; if(!muted){ ac(); SFX.tap(); } save(); },
  menu(){ sheetOpen=true; confirmEnd=false; },
  closeMenu(){ sheetOpen=false; },
  endAsk(){ confirmEnd=true; },
  endNo(){ confirmEnd=false; },
  endYes(){
    sheetOpen=false; confirmEnd=false;
    if(online() && net.isHost){ G.phase='closed'; publishHost(); const n=net; setTimeout(()=>{ leaveRoom(); }, 1500); G=null; H=null; }
    else if(online()){ leaveRoom(); G=null; savedJoin=null; }
    else { G=null; H=null; }
    view='home'; save();
  },
};
document.addEventListener('click', e=>{
  if(!muted) ac();
  if(e.target===$sheet){ sheetOpen=false; render(); return; }
  const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const f = A[b.dataset.act]; if(!f) return;
  if(f(b)!=='skip') render();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && sheetOpen){ sheetOpen=false; render(); }
  if(e.key==='Enter' && e.target && e.target.id==='joincode'){ A.join(); }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.id && t.id.startsWith('pname-')){ draft.names[+t.dataset.i] = t.value; save(); }
  else if(t.id==='custom'){ draft.custom = t.value; save(); }
  else if(t.id==='myname'){ me.name = cleanName(t.value); save(); }
  else if(t.id==='joincode'){ const v = t.value.toUpperCase().replace(/[^A-Z]/g,''); if(v!==t.value) t.value = v; }
});

/* ================= arranque ================= */
loadSaved();
(function(){
  const hc = (location.hash||'').slice(1).toUpperCase();
  if(/^[A-Z]{4}$/.test(hc)){ net.prefill = hc; view = 'online'; }
})();
render();
getRoom().then(()=>{ if(view==='home' || view==='online') render(); });
</script>
